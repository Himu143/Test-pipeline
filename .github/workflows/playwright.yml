name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_API: ${{ vars.PUBLIC_BASE_API || '' }}
      PUBLIC_BASE_RESOURCE_API: ${{ vars.PUBLIC_BASE_RESOURCE_API || '' }}
      PUBLIC_RESOURCE_ASSET_URL: ${{ vars.PUBLIC_RESOURCE_ASSET_URL || '' }}
      PUBLIC_BASE_AUTH_URL: ${{ vars.PUBLIC_BASE_AUTH_URL || '' }}
      PUBLIC_BASE_BOOKMARK_API: ${{ vars.PUBLIC_BASE_BOOKMARK_API || '' }}
      PUBLIC_BASE_USER_TRAINING_API: ${{ vars.PUBLIC_BASE_USER_TRAINING_API || '' }}
      PUBLIC_ENGLISH_USER_GUIDE_URL: ${{ vars.PUBLIC_ENGLISH_USER_GUIDE_URL || '' }}
      PUBLIC_SPANISH_USER_GUIDE_URL: ${{ vars.PUBLIC_SPANISH_USER_GUIDE_URL || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run Playwright tests - Chromium
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30