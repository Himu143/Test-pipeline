name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_API: ${{ vars.PUBLIC_BASE_API || 'http://localhost:5173' }}
      PUBLIC_BASE_RESOURCE_API: ${{ vars.PUBLIC_BASE_RESOURCE_API || 'http://localhost:5173/dw/api/v1' }}
      PUBLIC_RESOURCE_ASSET_URL: ${{ vars.PUBLIC_RESOURCE_ASSET_URL || 'https://directus-dev.mycaregivingcircle.org/assets' }}
      PUBLIC_BASE_AUTH_URL: ${{ vars.PUBLIC_BASE_AUTH_URL || 'http://localhost:5173/auth/api/v1' }}
      PUBLIC_BASE_ASSESSMENT_URL: ${{ vars.PUBLIC_BASE_ASSESSMENT_URL || 'https://sdp-dev.mycaregivingcircle.org/assessment/api/v1' }}
      PUBLIC_BASE_BOOKMARK_API: ${{ vars.PUBLIC_BASE_BOOKMARK_API || 'http://localhost:5173/bookmark/api/v1' }}
      PUBLIC_BASE_USER_TRAINING_API: ${{ vars.PUBLIC_BASE_USER_TRAINING_API || 'http://localhost:5173/training/api/v1' }}
      PUBLIC_ENGLISH_USER_GUIDE_URL: ${{ vars.PUBLIC_ENGLISH_USER_GUIDE_URL || 'https://directus-dev.mycaregivingcircle.org/assets/4330a7d8-db11-4cd6-a326-54e5f0c3a5b8?key=system-large-contain&v=2026-07-29T07%3A45%3A57.927Z' }}
      PUBLIC_SPANISH_USER_GUIDE_URL: ${{ vars.PUBLIC_SPANISH_USER_GUIDE_URL || 'https://directus-dev.mycaregivingcircle.org/assets/595cff8c-84a6-4d59-a2dd-56a9b94c7b94?key=system-large-contain&v=2026-07-29T07%3A45%3A57.927Z' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run Playwright tests - Chromium
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30