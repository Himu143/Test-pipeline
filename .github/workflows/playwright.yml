name: Playwright Tests

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: true
      BASE_URL: http://localhost:5173/
      PUBLIC_BASE_API: ${{ vars.STAGING_PUBLIC_BASE_API || 'https://sdp-dev.mycaregivingcircle.org' }}
      PUBLIC_BASE_AUTH_URL: ${{ vars.STAGING_PUBLIC_BASE_AUTH_URL || 'https://sdp-dev.mycaregivingcircle.org/auth/api/v1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14